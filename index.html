<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes Pad</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>QuickNotes</h1>
    <p>Jot down your daily ideas, tasks, and study reminders</p>
  </header>

  <main>
    <!-- Section 1: Note Creation Form -->
    <section>
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-input">Write something...</label>
        <input type="text" id="note-input" placeholder="What's on your mind?">
        
        <select id="note-category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>

        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <!-- Section 2: Saved Notes List -->
    <section>
      <h2>Your notes</h2>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Filter through your notes...">
        <button id="clear-all-btn" type="button">Clear all</button>
      </div>
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>Built for Day 5 Web Dev Project &bull; QuickNotes</p>
  </footer>

</body>
</html>
